<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Gemini Journal & AI Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-color: #f4f6fb; --card-bg: #ffffff; --primary: #4f46e5; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 24px; }
    .app-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 24px; }
    #chat-box { height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; font-size: 0.95rem; }
    .user { background: var(--primary); color: white; align-self: flex-end; }
    .bot { background: #f1f5f9; color: var(--text-main); align-self: flex-start; border: 1px solid var(--border); }
    textarea { width: 100%; height: 80px; padding: 14px; border-radius: 12px; border: 1px solid var(--border); outline: none; resize: none; }
    .button-group { display: flex; gap: 10px; margin-top: 12px; }
    button { padding: 12px 20px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; flex: 1; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-tertiary { background: #e0e7ff; color: #4338ca; }
    .history-item { background: var(--bg-color); padding: 16px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; }
    .history-date { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="auth-panel" class="card" style="text-align: center;">
      <p>Sign in with Google to use your journal</p>
      <button id="btn-login" class="btn-primary" style="margin-top: 15px;">Sign in with Google</button>
    </div>

    <div id="app-panel" style="display:none;">
      <div class="card">
        <div id="chat-box"></div>
        <textarea id="user-input" placeholder="Write your reflection..."></textarea>
        <div class="button-group">
          <button id="btn-send" class="btn-primary">Send Message</button>
          <button id="btn-history" class="btn-tertiary">View Past Reflections</button>
        </div>
      </div>

      <div id="history-panel" class="card" style="display:none; margin-top: 20px;">
        <h3>Past Reflection History</h3>
        <div id="history-container"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAn1jFHlGpPo0AXwcCKol7KU6MJ0t994sQ",
      authDomain: "personal-gemini-journal-506905.firebaseapp.com",
      projectId: "personal-gemini-journal-506905"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let currentUid = null;

    document.getElementById('btn-login').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUid = user.uid;
        document.getElementById('auth-panel').style.display = 'none';
        document.getElementById('app-panel').style.display = 'block';
      }
    });

    document.getElementById('btn-send').onclick = async () => {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message || !currentUid) return;

      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="msg user">${message}</div>`;
      input.value = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, uid: currentUid })
        });
        const data = await res.json();
        chatBox.innerHTML += `<div class="msg bot">${data.reply || data.response}</div>`;
      } catch (err) {
        chatBox.innerHTML += `<div class="msg bot">Server error.</div>`;
      }
    };

    document.getElementById('btn-history').onclick = async () => {
      if (!currentUid) return;
      const container = document.getElementById('history-container');
      container.innerHTML = '<p>Loading...</p>';
      document.getElementById('history-panel').style.display = 'block';

      try {
        const res = await fetch(`/api/history?uid=${currentUid}`);
        const data = await res.json();
        container.innerHTML = '';

        if (!data.history || data.history.length === 0) {
          container.innerHTML = '<p>No history found.</p>';
          return;
        }

        data.history.forEach(item => {
          const entryVal = item.userEntry || item.entry || 'N/A';
          const aiVal = item.aiResponse || item.response || 'N/A';
          
          container.innerHTML += `
            <div class="history-item">
              <p class="history-date">${item.date || 'Recently'}</p>
              <p><strong>YOUR ENTRY:</strong> ${entryVal}</p>
              <p><strong>GEMINI RESPONSE:</strong> ${aiVal}</p>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = '<p>Error loading history.</p>';
      }
    };
  </script>
</body>
</html>
